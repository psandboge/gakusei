name: gakusei-local
services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-gakusei_local}
      POSTGRES_USER: ${LOCAL_DB_USER:-gakusei_local}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local-db-init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
