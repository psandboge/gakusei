name: CI and browser baseline
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Linux tools
        id: tools
        run: bash scripts/install-ci-tools.sh
      - name: Clean dependencies
        id: dependencies
        run: npm ci
      - name: Toolchain preflight
        id: preflight
        run: npm run preflight
      - name: Frontend tests
        id: frontend
        run: npm test
      - name: Independent PostgreSQL backend tests
        id: backend
        run: bash scripts/test-postgres.sh -Dskip.frontend=true test
      - name: Production package
        id: build
        run: ./mvnw -Pproduction -DskipTests package
      - name: Chromium and Linux dependencies
        id: chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Owned browser journey, restart and reseed
        id: browser
        run: npm run test:browser
      - name: Lifecycle and browser ownership guards
        run: |
          python3 tests/lifecycle/boot4-environment.py
          python3 tests/lifecycle/check.py
          node tests/browser/check-guards.js
          python3 tests/lifecycle/upgrade-guards.py
          python3 tests/lifecycle/boot4-upgrade-guards.py
      - name: Collector privacy regression tests
        id: privacy_tests
        run: python3 scripts/test-ci-artifacts.py
      - name: Bounded exact ownership cleanup
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: python3 scripts/collect-ci-artifacts.py cleanup
      - name: Collect and validate private diagnostics
        id: privacy
        env:
          CI_PHASE_RESULTS: ${{ toJSON(steps) }}
        if: always()
        timeout-minutes: 2
        run: python3 scripts/collect-ci-artifacts.py collect
      - name: Upload safe diagnostics
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-browser-diagnostics
          path: artifacts/browser/
          retention-days: 14
          if-no-files-found: error
  boot3-upgrade:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Linux tools
        run: bash scripts/install-ci-tools.sh
      - name: Select verified historical Java 17
        run: |
          echo "JAVA_HOME=$GAKUSEI_JAVA17_HOME" >> "$GITHUB_ENV"
          echo "$GAKUSEI_JAVA17_HOME/bin" >> "$GITHUB_PATH"
      - name: Build immutable Boot 2 fixture
        run: |
          git worktree add --detach .tools/boot2-fixture 9d614c2506d5e58ad3a8343a92dc7d87f9fde1c4
          cd .tools/boot2-fixture
          test "$(git rev-parse HEAD)" = 9d614c2506d5e58ad3a8343a92dc7d87f9fde1c4
          npm ci
          npm run preflight
          bash scripts/test-postgres.sh -Dskip.frontend=true test
          ./mvnw -Pproduction -DskipTests package
      - name: Build immutable merged Boot 3 fixture
        run: |
          git worktree add --detach .tools/boot3-fixture 1bac4e96fe9a2f405eddff503056ef231fb4a8f9
          cd .tools/boot3-fixture
          test "$(git rev-parse HEAD)" = 1bac4e96fe9a2f405eddff503056ef231fb4a8f9
          npm ci
          npm run preflight
          bash scripts/test-postgres.sh -Dskip.frontend=true test
          ./mvnw -Pproduction -DskipTests package
      - name: Fresh and populated Boot 2 upgrade proof
        timeout-minutes: 15
        run: >-
          python3 scripts/observe-historical-proof.py
          --fixture "$GITHUB_WORKSPACE/.tools/boot3-fixture"
          --baseline-checkout "$GITHUB_WORKSPACE/.tools/boot2-fixture"
          --java-home "$GAKUSEI_JAVA17_HOME"
          --records "$GITHUB_WORKSPACE/.tools/historical-upgrade"
          -- bash scripts/test-boot3-upgrade.sh
          --baseline-jar "$GITHUB_WORKSPACE/.tools/boot2-fixture/target/gakusei.jar"
          --candidate-jar "$GITHUB_WORKSPACE/.tools/boot3-fixture/target/gakusei.jar"
          --baseline-sha 9d614c2506d5e58ad3a8343a92dc7d87f9fde1c4
      - name: Upgrade fail-closed and interrupted cleanup proof
        timeout-minutes: 10
        run: |
          python3 .tools/boot3-fixture/tests/lifecycle/upgrade-guards.py
          python3 scripts/observe-historical-proof.py --fixture "$GITHUB_WORKSPACE/.tools/boot3-fixture" --baseline-checkout "$GITHUB_WORKSPACE/.tools/boot2-fixture" --java-home "$GAKUSEI_JAVA17_HOME" --records "$GITHUB_WORKSPACE/.tools/historical-interrupt" -- python3 tests/lifecycle/upgrade-interrupt.py "$GITHUB_WORKSPACE/.tools/boot2-fixture/target/gakusei.jar" "$GITHUB_WORKSPACE/.tools/boot3-fixture/target/gakusei.jar"
      - name: Unconditional exact owned cleanup
        if: always()
        timeout-minutes: 5
        run: |
          cleanup_status=0
          if test -d .tools/boot3-fixture; then
            (cd .tools/boot3-fixture && python3 scripts/verify-boot3-upgrade.py --cleanup) || cleanup_status=1
          fi
          python3 scripts/collect-ci-artifacts.py cleanup || cleanup_status=1
          if test -d .tools/boot2-fixture; then
            (cd .tools/boot2-fixture && python3 scripts/collect-ci-artifacts.py cleanup) || cleanup_status=1
          fi
          exit "$cleanup_status"
  boot4-upgrade:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Linux tools
        run: bash scripts/install-ci-tools.sh
      - name: Build and bind independent frozen Boot 3
        run: |
          git worktree add --detach .tools/boot3-fixture 1bac4e96fe9a2f405eddff503056ef231fb4a8f9
          cd .tools/boot3-fixture
          npm ci
          npm run preflight
          JAVA_HOME="$GAKUSEI_JAVA17_HOME" PATH="$GAKUSEI_JAVA17_HOME/bin:$PATH" bash scripts/test-postgres.sh -Dskip.frontend=true test
          cd "$GITHUB_WORKSPACE"
          python3 scripts/build-upgrade-jar.py --checkout "$GITHUB_WORKSPACE/.tools/boot3-fixture" --manifest "$GITHUB_WORKSPACE/.tools/boot3-build.json" --java-home "$GAKUSEI_JAVA17_HOME" --expected-java-major 17
      - name: Build and bind candidate after regression
        run: |
          npm ci
          npm run preflight
          python3 scripts/build-upgrade-jar.py --checkout "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/.tools/boot4-build.json" --java-home "$GAKUSEI_JAVA25_HOME" --expected-java-major 25
      - name: Genuine manifest public negative guards
        run: >-
          python3 tests/lifecycle/java25-proof-guards.py --proof-pair boot3-boot4
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/boot3-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/boot4-build.json"
      - name: Fresh and populated immutable Boot 3 to Boot 4
        timeout-minutes: 15
        run: >-
          python3 scripts/run-boot4-proof.py
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/boot3-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/boot4-build.json"
      - name: Bound interruption and sentinel proof
        timeout-minutes: 10
        run: >-
          python3 scripts/run-boot4-proof.py --interrupt
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/boot3-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/boot4-build.json"
      - name: Unconditional exact ownership cleanup
        if: always()
        timeout-minutes: 5
        run: |
          cleanup_status=0
          python3 scripts/collect-ci-artifacts.py cleanup || cleanup_status=1
          if test -d .tools/boot3-fixture; then
            (cd .tools/boot3-fixture && python3 scripts/collect-ci-artifacts.py cleanup) || cleanup_status=1
          fi
          exit "$cleanup_status"
      - name: Collect safe pair diagnostics
        id: privacy
        if: always()
        timeout-minutes: 2
        env:
          CI_PHASE_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/collect-ci-artifacts.py collect
      - name: Upload safe pair diagnostics
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot4-upgrade-safe-diagnostics
          path: artifacts/browser/
          retention-days: 14
          if-no-files-found: error
  java25-upgrade:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Linux tools
        run: bash scripts/install-ci-tools.sh
      - name: Build and bind independent frozen Boot 4 Java17
        run: |
          git worktree add --detach .tools/boot4-fixture 710a0051099492f34b5e383c0bd9457d9934f2bc
          cd .tools/boot4-fixture
          npm ci
          npm run preflight
          JAVA_HOME="$GAKUSEI_JAVA17_HOME" PATH="$GAKUSEI_JAVA17_HOME/bin:$PATH" bash scripts/test-postgres.sh -Dskip.frontend=true test
          cd "$GITHUB_WORKSPACE"
          python3 scripts/build-upgrade-jar.py --checkout "$GITHUB_WORKSPACE/.tools/boot4-fixture" --manifest "$GITHUB_WORKSPACE/.tools/baseline-java17-build.json" --java-home "$GAKUSEI_JAVA17_HOME" --expected-java-major 17
      - name: Build and bind candidate after regression
        run: |
          npm ci
          npm run preflight
          python3 scripts/build-upgrade-jar.py --checkout "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/.tools/candidate-java25-build.json" --java-home "$GAKUSEI_JAVA25_HOME" --expected-java-major 25
      - name: Genuine manifest public negative guards
        run: >-
          python3 tests/lifecycle/java25-proof-guards.py --proof-pair boot4-java25
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/baseline-java17-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/candidate-java25-build.json"
      - name: Fresh and populated immutable Boot 4 Java17 to Boot 4
        timeout-minutes: 15
        run: >-
          python3 scripts/run-boot4-proof.py --proof-pair boot4-java25
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/baseline-java17-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/candidate-java25-build.json"
      - name: Bound interruption and sentinel proof
        timeout-minutes: 10
        run: >-
          python3 scripts/run-boot4-proof.py --proof-pair boot4-java25 --interrupt
          --baseline-build-manifest "$GITHUB_WORKSPACE/.tools/baseline-java17-build.json"
          --candidate-build-manifest "$GITHUB_WORKSPACE/.tools/candidate-java25-build.json"
      - name: Unconditional exact ownership cleanup
        if: always()
        timeout-minutes: 5
        run: |
          cleanup_status=0
          python3 scripts/collect-ci-artifacts.py cleanup || cleanup_status=1
          if test -d .tools/boot4-fixture; then
            (cd .tools/boot4-fixture && python3 scripts/collect-ci-artifacts.py cleanup) || cleanup_status=1
          fi
          exit "$cleanup_status"
      - name: Collect safe pair diagnostics
        id: privacy
        if: always()
        timeout-minutes: 2
        env:
          CI_PHASE_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/collect-ci-artifacts.py collect
      - name: Upload safe pair diagnostics
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java25-upgrade-safe-diagnostics
          path: artifacts/browser/
          retention-days: 14
          if-no-files-found: error
