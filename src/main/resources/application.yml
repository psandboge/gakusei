logging:
  file:
    name: log.txt
spring:
  cache:
    type: none
---
spring:
  profiles:
    default: local
  data:
    rest:
      base-path: /api
gakusei:
  data-init: false
  event-logging: true
  questions-quantity: 20
  kanji-quantity: 5
  retention-factor-min: 1.3


server:
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
---

spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:h2:mem:gakusei:DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=create schema if not exists CONTENTSCHEMA
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update


gakusei:
  data-init: true
---

spring:
  liquibase:
      change-log: classpath:/db/db.changelog-master.yaml
      enabled: false

---

spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/gakusei
    username: gakusei
    password: gakusei
    driver-class-name: org.postgresql.Driver

  liquibase:
      change-log: classpath:/db/db.changelog-master.yaml
      enabled: true
---

spring:
  config:
    activate:
      on-profile: enable-resource-caching
  caching: true
  cache-ttl: 3600
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

---

spring:
  config:
    activate:
      on-profile: heroku
  datasource:
    url: ${JDBC_DATABASE_URL}

gakusei:
  event-logging: false

---

