server:
  address: 127.0.0.1
  port: 8080
spring:
  devtools:
    livereload:
      enabled: false
  datasource:
    url: jdbc:h2:mem:gakusei;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS CONTENTSCHEMA
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  cache:
    type: none
gakusei:
  data-init: true
  event-logging: true
  remember-me-key: ${LOCAL_REMEMBER_ME_KEY:disposable-local-gakusei}
